<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StillWater Testimonials Chat</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/testimonials.css">
</head>
<body>
  <div class="page-bg"></div>

  <main class="chat-shell">
    <header class="chat-header">
      <a class="brand" href="/index.html" aria-label="StillWater home">
        <span class="brand-mark">*</span>
        <span class="brand-name">Still<span>Water</span></span>
      </a>
      <div class="header-actions">
        <select id="languageSelect" class="lang-select" title="Preferred response language" aria-label="Preferred response language">
          <option value="en">English</option>
          <option value="hi">Hindi</option>
        </select>
      </div>
    </header>

    <section class="chat-title-block">
      <h1>Testimonials Chat</h1>
      <p>Ask questions and get short answers grounded in patient stories.</p>
    </section>

    <section id="chatFeed" class="chat-feed" aria-live="polite">
      <article class="msg assistant-msg">
        <div class="msg-role">StillWater</div>
        <div class="msg-body">
          Ask about improvements, timelines, diet changes, or consistency patterns from testimonials.
        </div>
      </article>
    </section>

    <section class="quick-prompts" aria-label="Suggested prompts">
      <button class="prompt-chip" data-question="How did patients reduce medicines with a plant-based diet?" type="button">Reducing medicines</button>
      <button class="prompt-chip" data-question="What are the benefits of a plant-based diet in diabetes?" type="button">Diet benefits</button>
      <button class="prompt-chip" data-question="How long did it take to see improvements?" type="button">Time to improve</button>
    </section>

    <form id="composer" class="composer" autocomplete="off">
      <label class="sr-only" for="userInput">Ask a question</label>
      <textarea
        id="userInput"
        class="composer-input"
        placeholder="Ask a question from testimonials..."
        maxlength="500"
        rows="2"
      ></textarea>
      <div class="composer-meta">
        <span id="charCount" class="char-count">0/500</span>
        <button id="askBtn" class="send-btn" type="submit">Send</button>
      </div>
    </form>
  </main>

  <script src="js/testimonials.js"></script>
</body>
</html>
