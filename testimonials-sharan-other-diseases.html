<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="css/testimonials.css" />

<!-- Microsoft Clarity (prod only) -->
<script type="text/javascript">
  (function(){
    var prodHosts = ['stillwater.you','www.stillwater.you','stillwater-main.onrender.com'];
    if (prodHosts.indexOf(location.hostname) === -1) return;
    (function(c,l,a,r,i,t,y){
      c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
      t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
      y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "ww8pdzkpcp");
  })();
    </script>
  </head>
  <body data-dataset="sharan_other_diseases">
    <div class="canvas-bg"></div>

    <div class="page-shell">
      <header class="topbar">
        <a id="backLink" class="home-link" href="/testimonials.html">Back</a>
        <a class="top-brand" href="/index.html" aria-label="Stilwater home"><span class="top-brand-text">Stil<span class="top-brand-tail">water</span></span></a>
        <div class="lang-wrap">
          <button
            id="langButton"
            class="lang-button"
            type="button"
            aria-expanded="false"
            aria-haspopup="listbox"
          >
            <span id="langCurrent">English</span>
            <span class="lang-arrow">v</span>
          </button>
          <div id="langMenu" class="lang-menu" role="listbox" hidden>
            <button
              type="button"
              data-lang="English"
              class="lang-item is-active"
            >
              English
            </button>
            <button type="button" data-lang="Hindi" class="lang-item">
              Hindi
            </button>
          </div>
        </div>
      </header>

      <main class="main-wrap">
        <section class="hero">
          <div class="brand-dot"></div>
          <h1 id="heroTitle" class="title text-gradient">
            Sharan Other Diseases Testimonials AI
          </h1>
        </section>

        <section class="samples">
          <h2 class="section-label" id="samplesLabel">Sample Questions</h2>
          <div id="sampleQuestions" class="sample-list"></div>
        </section>

        <section class="ask-block">
          <h2 class="section-label" id="askLabel">Ask your question</h2>

          <div class="input-shell">
            <input
              id="queryInput"
              class="query-input"
              type="text"
              placeholder="Type your question here..."
            />
            <button
              id="voiceButton"
              class="icon-button"
              type="button"
              title="Voice input"
              aria-label="Voice input"
            >
              Mic
            </button>
          </div>

          <div class="actions-row">
            <button id="askButton" class="ask-button" type="button">Ask</button>
          </div>
        </section>

        <section id="resultsSection" class="results" hidden>
          <div class="glass-card">
            <h3 class="card-title" id="answerLabel">Answer</h3>
            <div id="answerBody" class="answer-body"></div>
          </div>

          <div class="glass-card">
            <h3 class="card-title" id="sourcesLabel">Sources</h3>
            <div id="sourcesList" class="sources-list"></div>
          </div>

          <div class="glass-card">
            <h3 class="card-title" id="voiceLabel">Voice Output</h3>
            <div class="voice-row">
              <button id="speakButton" class="voice-action" type="button">
                Speak
              </button>
              <button id="stopButton" class="voice-action muted" type="button">
                Stop
              </button>
            </div>
          </div>
        </section>

        <section
          id="statusMessage"
          class="status-message"
          aria-live="polite"
        ></section>
      </main>
    </div>

    <script src="js/testimonials.js"></script>
  </body>
</html>
