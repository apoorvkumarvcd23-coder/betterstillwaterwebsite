services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stillwater
      POSTGRES_PASSWORD: stillwater
      POSTGRES_DB: stillwater
    ports:
      - "5433:5432"
    volumes:
      - stillwater-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stillwater"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  main-website:
    build:
      context: .
    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL}
      DB_SSL: ${DB_SSL:-false}
      ALLOW_INSECURE_PHONE_LOGIN: ${ALLOW_INSECURE_PHONE_LOGIN:-true}
      SESSION_SECRET: ${SESSION_SECRET}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      BASE_URL: ${BASE_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      LEMONSLICE_API_KEY: ${LEMONSLICE_API_KEY}
      RAG_LLM_PROVIDER: ${RAG_LLM_PROVIDER}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL}
      OPENROUTER_CHAT_MODEL: ${OPENROUTER_CHAT_MODEL}
      OPENROUTER_EMBED_MODEL: ${OPENROUTER_EMBED_MODEL}
      ARIA_MODEL: ${ARIA_MODEL}
      RAG_SHARAN_DATABASE_URL: ${RAG_SHARAN_DATABASE_URL}
      RAG_TESTIMONIALS_TABLE: ${RAG_TESTIMONIALS_TABLE}
      RAG_TESTIMONIALS_TABLE_DIABETES: ${RAG_TESTIMONIALS_TABLE_DIABETES}
      RAG_TESTIMONIALS_TABLE_AMAR_EYE_YOGA: ${RAG_TESTIMONIALS_TABLE_AMAR_EYE_YOGA}
      RAG_TESTIMONIALS_TABLE_SHARAN_OTHER_DISEASES: ${RAG_TESTIMONIALS_TABLE_SHARAN_OTHER_DISEASES}
      RAG_TESTIMONIALS_TABLE_AA_WELLNESS: ${RAG_TESTIMONIALS_TABLE_AA_WELLNESS}
    ports:
      - "3005:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/funds"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  stillwater-db: