services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stillwater
      POSTGRES_PASSWORD: stillwater
      POSTGRES_DB: stillwater
    ports:
      - "5433:5432"
    volumes:
      - stillwater-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stillwater"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  main-website:
    build:
      context: .
    environment:
      PORT: 3000
      DATABASE_URL: postgres://stillwater:stillwater@db:5432/stillwater
      ALLOW_INSECURE_PHONE_LOGIN: "true"
      SESSION_SECRET: ${SESSION_SECRET:-stillwater-secret}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      LEMONSLICE_API_KEY: ${LEMONSLICE_API_KEY}
      BASE_URL: http://localhost:3005
      CORS_ORIGIN: http://localhost:3005
    ports:
      - "3005:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/funds"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  stillwater-db:
