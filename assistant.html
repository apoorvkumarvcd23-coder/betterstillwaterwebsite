<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stillwater Guided Session</title>
    <link rel="stylesheet" href="css/index.css" />
    <style>
      :root {
        color-scheme: dark;
        --meeting-bg: #0a1516;
        --meeting-surface: rgba(10, 26, 28, 0.82);
        --meeting-border: rgba(240, 237, 228, 0.2);
        --meeting-text: #f1eee5;
        --meeting-text-soft: rgba(241, 238, 229, 0.8);
        --meeting-shadow: 0 24px 70px rgba(2, 7, 8, 0.52);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: var(--font-body, "Jost", sans-serif);
        color: var(--meeting-text);
        background:
          radial-gradient(circle at 16% 12%, rgba(66, 120, 121, 0.22), transparent 34%),
          radial-gradient(circle at 84% 86%, rgba(205, 178, 124, 0.15), transparent 36%),
          linear-gradient(180deg, #091415 0%, var(--meeting-bg) 100%);
        overflow: hidden;
      }

      .layout {
        min-height: 100vh;
        padding: clamp(0.7rem, 2vw, 1.25rem);
      }

      .meeting-shell {
        position: relative;
        width: 100%;
        height: calc(100vh - clamp(1.4rem, 4vw, 2.5rem));
        border-radius: clamp(18px, 2.4vw, 30px);
        border: 1px solid var(--meeting-border);
        background: linear-gradient(180deg, rgba(8, 20, 21, 0.9) 0%, rgba(8, 20, 21, 0.78) 100%);
        box-shadow: var(--meeting-shadow);
        overflow: hidden;
      }

      .meeting-stage {
        position: absolute;
        inset: 0;
        border-radius: inherit;
        overflow: hidden;
      }

      .meeting-stage::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08), inset 0 0 140px rgba(2, 8, 9, 0.2);
      }

      .stage-frame {
        width: 100%;
        height: 100%;
        background: #060d0e;
      }

      .overlay-top {
        position: absolute;
        top: clamp(0.7rem, 1.9vw, 1.1rem);
        left: clamp(0.7rem, 1.9vw, 1.1rem);
        right: clamp(0.7rem, 1.9vw, 1.1rem);
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        pointer-events: none;
        z-index: 3;
      }

      .meta-tray {
        pointer-events: none;
        display: grid;
        justify-items: end;
        gap: 0.45rem;
      }

      .status-chip {
        pointer-events: auto;
        max-width: min(78vw, 560px);
        border: 1px solid rgba(238, 234, 223, 0.26);
        border-radius: 999px;
        background: var(--meeting-surface);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        padding: 0.55rem 0.9rem;
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
      }

      .status-chip[data-state="connecting"],
      .status-chip[data-state="retrying"] {
        border-color: rgba(148, 204, 195, 0.38);
        background: rgba(8, 30, 29, 0.84);
      }

      .status-chip[data-state="ready"],
      .status-chip[data-state="connected"] {
        border-color: rgba(173, 224, 176, 0.38);
        background: rgba(7, 31, 22, 0.84);
      }

      .status-chip[data-state="ended"] {
        border-color: rgba(244, 222, 165, 0.38);
        background: rgba(40, 31, 15, 0.84);
      }

      .status-chip[data-state="error"] {
        border-color: rgba(255, 183, 183, 0.44);
        background: rgba(52, 19, 23, 0.86);
      }

      .status-line {
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 0.67rem;
        color: rgba(245, 241, 230, 0.76);
        line-height: 1;
      }

      .status-message {
        margin-top: 0.26rem;
        font-size: 0.9rem;
        color: var(--meeting-text);
        line-height: 1.2;
      }

      .meeting-meta {
        pointer-events: auto;
        display: inline-flex;
        align-items: center;
        gap: 0.48rem;
        border: 1px solid rgba(238, 234, 223, 0.26);
        border-radius: 999px;
        background: var(--meeting-surface);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        padding: 0.48rem 0.8rem;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.24);
      }

      .meeting-meta-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #8c9698;
        box-shadow: 0 0 0 0 rgba(140, 150, 152, 0.35);
      }

      .meeting-meta[data-live="true"] .meeting-meta-dot {
        background: #8de4a8;
        box-shadow: 0 0 0 8px rgba(141, 228, 168, 0);
        animation: livePulse 1.9s ease-in-out infinite;
      }

      .meeting-meta-text {
        font-size: 0.67rem;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--meeting-text-soft);
        line-height: 1;
      }

      .meeting-meta-id {
        margin-left: 0.2rem;
        font-size: 0.7rem;
        letter-spacing: 0.03em;
        color: var(--meeting-text);
      }

      .top-actions {
        pointer-events: auto;
        display: flex;
        align-items: center;
        gap: 0.45rem;
      }

      .top-actions[hidden] {
        display: none;
      }

      .control-btn {
        pointer-events: auto;
        border: 1px solid rgba(244, 241, 232, 0.3);
        border-radius: 999px;
        background: rgba(10, 24, 26, 0.84);
        color: var(--meeting-text);
        padding: 0.66rem 1.05rem;
        font-size: 0.73rem;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        cursor: pointer;
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
        transition: transform 0.22s ease, background-color 0.22s ease, border-color 0.22s ease;
      }

      .control-btn:hover {
        transform: translateY(-1px);
        background: rgba(16, 36, 38, 0.95);
        border-color: rgba(244, 241, 232, 0.45);
      }

      .control-btn:disabled {
        opacity: 0.58;
        cursor: default;
      }

      .control-btn[hidden] {
        display: none;
      }

      .control-btn.end {
        border-color: rgba(255, 186, 186, 0.34);
        background: rgba(73, 24, 29, 0.74);
      }

      .control-btn.end:hover {
        background: rgba(94, 28, 36, 0.9);
      }

      .control-btn.ghost {
        border-style: dashed;
        color: var(--meeting-text-soft);
      }

      @media (max-width: 900px) {
        .meeting-shell {
          border-radius: 18px;
          height: calc(100vh - 1.2rem);
        }

        .status-chip {
          max-width: calc(100vw - 2.2rem);
          padding: 0.48rem 0.8rem;
        }

        .status-message {
          font-size: 0.84rem;
        }

        .overlay-top {
          align-items: flex-start;
          gap: 0.5rem;
        }

        .meta-tray {
          gap: 0.38rem;
        }

        .top-actions {
          flex-wrap: wrap;
          justify-content: flex-end;
          max-width: min(44vw, 220px);
        }

        .control-btn {
          padding: 0.55rem 0.8rem;
          font-size: 0.66rem;
        }
      }

      @media (prefers-reduced-motion: no-preference) {
        .meeting-shell {
          animation: shellIn 640ms cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .overlay-top {
          animation: riseIn 700ms 120ms cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .top-actions {
          animation: riseIn 700ms 220ms cubic-bezier(0.16, 1, 0.3, 1) both;
        }
      }

      @keyframes shellIn {
        from {
          opacity: 0;
          transform: scale(0.98);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes riseIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes livePulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(141, 228, 168, 0.32);
        }
        50% {
          box-shadow: 0 0 0 8px rgba(141, 228, 168, 0);
        }
      }
    </style>

  <body>
    <main class="layout">
      <section class="meeting-shell">
        <div class="meeting-stage">
          <div id="dailyContainer" class="stage-frame"></div>
        </div>

        <div class="overlay-top">
          <div class="status-chip" id="statusChip" data-state="connecting">
            <div class="status-line" id="statusLine">Connecting</div>
            <div class="status-message" id="statusMessage">
              Connecting you to your Stillwater guide...
            </div>
          </div>
          <div class="meta-tray">
            <div class="meeting-meta" id="meetingMeta" data-live="false">
              <span class="meeting-meta-dot" aria-hidden="true"></span>
              <span class="meeting-meta-text">Session</span>
              <span class="meeting-meta-id" id="meetingMetaId">Pending</span>
            </div>
            <div class="top-actions" id="topActions" hidden>
              <button class="control-btn" id="retryButton" hidden>Retry</button>
              <button class="control-btn end" id="endButton">End Session</button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="https://unpkg.com/@daily-co/daily-js"></script>
    <script>
      const statusLineEl = document.getElementById("statusLine");
      const statusMessageEl = document.getElementById("statusMessage");
      const statusChip = document.getElementById("statusChip");
      const meetingMeta = document.getElementById("meetingMeta");
      const meetingMetaId = document.getElementById("meetingMetaId");
      const topActions = document.getElementById("topActions");
      const retryButton = document.getElementById("retryButton");
      const endButton = document.getElementById("endButton");
      const dailyContainer = document.getElementById("dailyContainer");

      const query = new URLSearchParams(window.location.search);
      let submissionId = query.get("submissionId") || "";
      const agentId = query.get("agentId") || "agent_6194e41857189803";

      let callFrame = null;
      let attemptCount = 0;
      let currentSessionId = "";
      let usageSessionClosed = false;
      let sessionEndInFlight = null;
      const MAX_ATTEMPTS = 2;

      meetingMetaId.textContent = submissionId ? `#${submissionId}` : "Pending";

      const resolveSubmissionId = async () => {
        if (submissionId) {
          return submissionId;
        }

        try {
          const response = await fetch("/api/auth/me", { credentials: "include" });
          const user = await response.json().catch(() => null);
          if (
            response.ok &&
            user &&
            user.authenticated &&
            typeof user.latestSubmissionId === "string" &&
            user.latestSubmissionId.trim()
          ) {
            submissionId = user.latestSubmissionId.trim();
          }
        } catch (_err) {
          // Keep existing behavior when auth resolution fails.
        }

        return submissionId;
      };

      const setStatus = (line, message, state = "neutral") => {
        statusLineEl.textContent = line;
        statusMessageEl.textContent = message;
        statusChip.dataset.state = state;
      };

      const setActionMode = (mode) => {
        const modeKey = String(mode || "").toLowerCase();

        if (modeKey === "connected" || modeKey === "ready") {
          topActions.hidden = true;
          retryButton.hidden = true;
          return;
        }

        if (modeKey === "error" || modeKey === "ended") {
          topActions.hidden = false;
          retryButton.hidden = false;
          return;
        }

        topActions.hidden = true;
        retryButton.hidden = true;
      };

      const createRoom = async () => {
        const response = await fetch("/api/lemonslice/rooms", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            agentId,
            submissionId,
          }),
        });

        const body = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(body.error || "Unable to create a guided session.");
        }

        return body;
      };

      const reportSessionEnd = async (endReason, { keepalive = false } = {}) => {
        if (!currentSessionId || usageSessionClosed) {
          return;
        }

        if (sessionEndInFlight) {
          return sessionEndInFlight;
        }

        sessionEndInFlight = (async () => {
          try {
            const response = await fetch("/api/lemonslice/usage/end", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              keepalive,
              body: JSON.stringify({
                session_id: currentSessionId,
                end_reason: endReason,
              }),
            });

            if (response.ok) {
              usageSessionClosed = true;
            }
          } catch (_err) {
            // Ignore transient telemetry failures in client UX.
          } finally {
            sessionEndInFlight = null;
          }
        })();

        return sessionEndInFlight;
      };

      const bindFrameEvents = (frame) => {
        frame.on("joined-meeting", () => {
          setStatus("Connected", "Your guided session is live.", "connected");
          meetingMeta.dataset.live = "true";
          setActionMode("connected");
        });

        frame.on("left-meeting", () => {
          void reportSessionEnd("left_meeting");
          setStatus("Session Ended", "Your session has ended. You may start again anytime.", "ended");
          meetingMeta.dataset.live = "false";
          setActionMode("ended");
        });

        frame.on("app-message", (ev) => {
          const type = ev && ev.data ? ev.data.type : "";
          if (type === "bot_ready") {
            setStatus("Guide Ready", "Your Stillwater guide is ready. Speak when comfortable.", "ready");
            setActionMode("ready");
            return;
          }

          if (type === "idle_timeout") {
            void reportSessionEnd("idle_timeout");
            setStatus("Session Timed Out", "The session ended due to inactivity.", "ended");
            meetingMeta.dataset.live = "false";
            setActionMode("ended");
            return;
          }

          if (type === "daily_error" || type === "video_generation_error") {
            setStatus("Session Alert", "A live session issue occurred. You can retry the connection.", "error");
            setActionMode("error");
          }
        });
      };

      const ensureFrame = () => {
        if (callFrame) {
          return callFrame;
        }

        callFrame = window.DailyIframe.createFrame(dailyContainer, {
          iframeStyle: {
            width: "100%",
            height: "100%",
            border: "0",
            borderRadius: "0",
          },
          showLeaveButton: true,
        });

        bindFrameEvents(callFrame);
        return callFrame;
      };

      const joinSession = async () => {
        attemptCount += 1;

        if (attemptCount === 1) {
          setStatus("Connecting", "Connecting you to your Stillwater guide...", "connecting");
        } else {
          setStatus("Retrying", "Connection took longer than expected. Retrying now...", "retrying");
        }

        if (currentSessionId && !usageSessionClosed) {
          await reportSessionEnd("error");
        }

        const room = await createRoom();
        if (room && room.session_id) {
          currentSessionId = room.session_id;
          usageSessionClosed = false;
          sessionEndInFlight = null;
          meetingMetaId.textContent = room.session_id;
        }
        const frame = ensureFrame();

        await frame.join({
          url: room.room_url,
          token: room.token,
        });
      };

      const startSession = async () => {
        setActionMode("connecting");

        try {
          await joinSession();
        } catch (error) {
          if (attemptCount < MAX_ATTEMPTS) {
            await startSession();
            return;
          }

          setStatus(
            "Connection Pending",
            "Still not connected. Please tap Retry.",
            "error",
          );
          meetingMeta.dataset.live = "false";
          setActionMode("error");
          console.error("Assistant session failed:", error);
        }
      };

      retryButton.addEventListener("click", async () => {
        attemptCount = 0;
        await startSession();
      });

      endButton.addEventListener("click", async () => {
        if (!callFrame) {
          await reportSessionEnd("user_end");
          setStatus("Session Ended", "Your session has ended. You may start again anytime.", "ended");
          meetingMeta.dataset.live = "false";
          setActionMode("ended");
          return;
        }

        try {
          await reportSessionEnd("user_end");
          await callFrame.leave();
          setStatus("Session Ended", "Your session has ended. You may start again anytime.", "ended");
          setActionMode("ended");
        } catch (err) {
          console.error("Failed to end session:", err);
          setStatus("Session Alert", "Could not end the session cleanly. You can retry.", "error");
          setActionMode("error");
        }
      });

      window.addEventListener("beforeunload", async () => {
        if (currentSessionId && !usageSessionClosed) {
          const payload = JSON.stringify({
            session_id: currentSessionId,
            end_reason: "unload",
          });

          if (navigator.sendBeacon) {
            navigator.sendBeacon(
              "/api/lemonslice/usage/end",
              new Blob([payload], { type: "application/json" }),
            );
          } else {
            void reportSessionEnd("unload", { keepalive: true });
          }
        }

        if (!callFrame) {
          return;
        }
        try {
          await callFrame.leave();
          callFrame.destroy();
        } catch (_err) {
          // Ignore cleanup errors on unload.
        }
      });

      const bootstrapSession = async () => {
        await resolveSubmissionId();

        if (!submissionId) {
          setStatus(
            "Assessment Required",
            "Complete the intake assessment before starting the AI avatar session.",
            "error",
          );
          meetingMeta.dataset.live = "false";
          meetingMetaId.textContent = "Assessment Required";
          setActionMode("error");
          return;
        }

        meetingMetaId.textContent = `#${submissionId}`;
        startSession();
      };

      bootstrapSession();
    </script>
  </body>
