services:
  # ── 1. Main website ──────────────────────────────────────────────────────────
  - type: web
    name: stillwater-main
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/funds
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      # Set to your Render URL, e.g. https://stillwater-main.onrender.com
      - key: BASE_URL
        sync: false
      # Set to your Render URL, e.g. https://stillwater-main.onrender.com
      - key: CORS_ORIGIN
        sync: false
      # e.g. .onrender.com  (leading dot so cookie spans all subdomains)
      - key: COOKIE_DOMAIN
        sync: false
      - key: DB_SSL
        value: "true"
      - key: RAG_LLM_PROVIDER
        value: "openrouter"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: "openai/gpt-oss-120b"
      - key: OPENROUTER_CHAT_MODEL
        value: "openai/gpt-oss-120b"
      - key: OPENROUTER_EMBED_MODEL
        value: "openai/text-embedding-3-small"
      - key: RAG_TESTIMONIALS_TABLE
        value: "testimonials.testimonials_dim_diabetes_amareye"
